<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .tabela {
            border-collapse: collapse;
        }
        .tabela, .tabela td{
            border: 1px solid black;
        }
        td {
            width: 200px;
        }
    </style>
    <title>Tabelas em HTML</title>
</head>
<body>
    <table class="tabela">   
         <tr>
            <td>nome</td>
            <td>nota 1</td>
            <td>nota 2</td>
         </tr>
         <tr>
            <td>João</td>
            <td>8.0</td>
            <td>7.5</td>
         </tr>
         <tr>
            <td>Maria</td>
            <td>9.0</td>
            <td>8.5</td>
         </tr>
    </table>
</body>
</html>
