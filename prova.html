<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador fatorial</title>
</head>
<body>
    <h1>Calculadora Fatorial</h1>
    
        <label for="numero">Digite um número inteiro e positivo:</label>
        <input type="number" id="numero" name="numero" min="0" required>
        <button class="button" onclick="calcular()">Calcular</button>

        <div>
            <p class="res"></p>
        </div>

        <script>
            var n = document.getElementById("numero");
            var btn = document.querySelector("button");
            var res = document.querySelector(".res");
            function calcular() {
                var num = Number(n.value);
                if (num < 0 || !Number.isInteger(num)) {
                    res.innerHTML = "Por favor, insira um número inteiro e positivo.";
                    return;
                }
                var fatorial = 1;
                for (var i = 2; i <= num; i++) {
                    fatorial *= i;
                }
                res.innerHTML = "O fatorial de " + num + " é " + fatorial + ".";
            }
        </script>
</body>
</html>
